<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="认知症照护专区登录页">
  <title>登录 | 认知症照护专区</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1a5276;
      --primary-light: #2f77a8;
      --accent: #ff8c42;
      --text: #172033;
      --muted: #66758a;
      --bg: #fff8ee;
      --card: rgba(255,255,255,0.92);
      --shadow: 0 20px 52px rgba(73, 47, 20, 0.18);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 18%, rgba(255,220,140,0.55) 0, rgba(255,220,140,0) 28%),
        linear-gradient(135deg, #ec7a68 0%, #f3a153 30%, #f7d76f 60%, #9dd08a 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .shell {
      width: min(960px, 100%);
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 24px;
      align-items: stretch;
    }
    .hero, .panel {
      border-radius: 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }
    .hero {
      padding: 42px 40px;
      background: rgba(255,255,255,0.18);
      color: #122033;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 560px;
    }
    .hero-logo {
      margin-bottom: 18px;
      padding: 16px 18px;
      border-radius: 24px;
      background: rgba(255,255,255,0.78);
      box-shadow: 0 18px 36px rgba(36, 61, 110, 0.12);
    }
    .hero-logo img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 16px;
    }
    .brand {
      font-family: "Noto Serif SC", serif;
      font-size: clamp(28px, 4vw, 46px);
      font-weight: 900;
      letter-spacing: 2px;
      margin: 0 0 14px;
    }
    .hero h1 {
      margin: 0 0 16px;
      font-family: "Noto Serif SC", serif;
      font-size: clamp(26px, 3.4vw, 42px);
      line-height: 1.24;
    }
    .hero p {
      margin: 0;
      max-width: 42ch;
      font-size: 17px;
      line-height: 1.8;
      color: rgba(18,32,51,0.88);
    }
    .hero .note {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(255,255,255,0.24);
      color: #132033;
      font-size: 14px;
      line-height: 1.7;
    }
    .panel {
      padding: 34px 32px;
      background: var(--card);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .panel h2 {
      margin: 0 0 8px;
      font-size: 26px;
    }
    .panel .sub {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.7;
    }
    .field { margin-bottom: 16px; }
    label {
      display: block;
      margin-bottom: 6px;
      color: #223249;
      font-size: 14px;
      font-weight: 700;
    }
    input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1.5px solid #d7e0ea;
      border-radius: 12px;
      background: #fff;
      font-size: 15px;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus {
      outline: none;
      border-color: var(--primary-light);
      box-shadow: 0 0 0 4px rgba(47,119,168,0.12);
    }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin: 10px 0 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }
    .row strong { color: var(--text); }
    .actions { display: flex; gap: 12px; }
    button {
      flex: 1;
      height: 48px;
      border: 0;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-login {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: #fff;
      box-shadow: 0 10px 22px rgba(26,82,118,0.24);
    }
    .btn-reset {
      background: #eef3f7;
      color: #415164;
    }
    .status {
      min-height: 22px;
      margin-top: 14px;
      color: #c0392b;
      font-size: 14px;
    }
    .footer-note {
      margin-top: 16px;
      color: #7a8798;
      font-size: 12px;
      line-height: 1.7;
    }
    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; }
      .hero { min-height: auto; }
    }
  </style>
  <script src="auth.js"></script>
</head>
<body>
  <div class="shell">
    <section class="hero">
      <div>
        <div class="hero-logo">
          <img src="assets/thinkcare-logo.png" alt="思德智护">
        </div>
        <div class="brand">思德库</div>
        <h1>认知症照护专区<br>临时登录入口</h1>
        <p>请输入分配给你的用户名和密码，验证通过后才能进入本站的各个工具页面。</p>
      </div>
      <div class="note">
        <strong>有效期：</strong><span id="expiryLabel"></span><br>
        <strong>说明：</strong>账号由管理员单独发放，过期后将自动失效。
      </div>
    </section>
    <section class="panel">
      <h2>登录</h2>
      <p class="sub">请填写分配账号。登录成功后会自动回到你刚才访问的页面。</p>
      <form id="loginForm">
        <div class="field">
          <label for="username">用户名</label>
          <input id="username" name="username" autocomplete="username" placeholder="例如：ad01" autofocus>
        </div>
        <div class="field">
          <label for="password">密码</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码">
        </div>
        <div class="row">
          <span>有效期：<strong>1 天</strong></span>
        </div>
        <div class="actions">
          <button class="btn-login" type="submit">进入系统</button>
          <button class="btn-reset" type="button" id="resetBtn">清空</button>
        </div>
        <div class="status" id="status"></div>
        <div class="footer-note">
          提示：请输入管理员发放的账号。登录后会在浏览器里保留 1 天的会话。
        </div>
      </form>
    </section>
  </div>
  <script src="login.js"></script>
</body>
</html>
